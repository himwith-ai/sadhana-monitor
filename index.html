<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🪷 Sadhana Monitor — Spiritual Companion</title>

  <!-- Meta tags for SEO & PWA feel -->
  <meta name="description" content="A premium, offline-first spiritual practice tracker for ISKCON devotees." />
  <meta name="theme-color" content="#E8730A" />

  <!-- Manifest & PWA -->
  <link rel="manifest" href="./manifest.json" />

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/animations.css" />

  <!-- Chart.js & Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase Production Configuration (Option B) -->
  <script>
    window.SADHANA_CONFIG = {
      // Replace with your Supabase Project URL & Anon Key from https://supabase.com
      SUPABASE_URL: "https://qbhycbnkkunkmmnzaycr.supabase.co",
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFiaHljYm5ra3Vua21tbnpheWNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODU0NTgsImV4cCI6MjEwMTU2MTQ1OH0.cd4hu3Sieh7iKWpdYJBSIUnv5-VAlasdHcOANd9f23g"
    };

</head>

<body>

  <!-- Main Mobile App Shell -->
  <div id="app-shell">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Celebration Save Overlay -->
    <div id="celebration-overlay">
      <div class="celebration-lotus">🪷</div>
      <div class="celebration-title">Jai Srila Prabhupada! 🙏</div>
      <div style="font-size: 0.95rem; opacity: 0.9;">Today's Sadhana Score</div>
      <div class="celebration-score-ring">
        <div class="celebration-score-num" id="cel-score-num">85</div>
        <div style="font-size: 0.7rem;">POINTS</div>
      </div>
      <div class="celebration-streak-badge">🔥 Sadhana Updated</div>
      <div style="font-size: 0.75rem; opacity: 0.7;">(Tap anywhere to continue)</div>
    </div>

    <!-- Header Bar -->
    <header class="top-header" id="top-header">
      <div class="header-user-info">
        <div class="avatar-circle" id="header-avatar" title="Switch Profile">🪷</div>
        <div class="header-title-group">
          <h2 id="header-user-name">Devotee</h2>
          <p id="header-user-sub">Hare Krishna 🙏</p>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Screen Content Container -->
    <main id="main-content">
      <!-- Screen 0: Auth Gateway (Login / Register) -->
      <section id="screen-auth" class="screen"></section>

      <!-- Screen 1: Profile Select -->
      <section id="screen-profile-select" class="screen"></section>

      <!-- Screen 2: Onboarding Wizard -->
      <section id="screen-onboarding" class="screen"></section>

      <!-- Screen 3: Home Dashboard -->
      <section id="screen-home" class="screen"></section>

      <!-- Screen 4: Daily Entry Form -->
      <section id="screen-entry" class="screen"></section>

      <!-- Screen 5: Analytics -->
      <section id="screen-analytics" class="screen"></section>

      <!-- Screen 6: Counsellor Dashboard -->
      <section id="screen-counsellor" class="screen"></section>

      <!-- Screen 7: Settings -->
      <section id="screen-settings" class="screen"></section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-item active" data-screen="home">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-item" data-screen="entry">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
        <span>Log Entry</span>
      </button>

      <button class="nav-item" data-screen="analytics">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <line x1="18" y1="20" x2="18" y2="10" />
          <line x1="12" y1="20" x2="12" y2="4" />
          <line x1="6" y1="20" x2="6" y2="14" />
        </svg>
        <span>Analytics</span>
      </button>

      <button class="nav-item" data-screen="counsellor">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
        <span>Counsellor</span>
      </button>

      <button class="nav-item" data-screen="settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span>Settings</span>
      </button>
    </nav>

  </div>

  <!-- Main ES Module Boot Script -->
  <script type="module" src="./js/app.js"></script>
</body>

</html>
